<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  width="1000"
  height="1000"
  viewBox="0 0 1000 1000"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  stroke="white"
  stroke-width="28"
  stroke-linecap="round"
  stroke-linejoin="round">

  <!-- Círculo exterior -->
  <circle cx="500" cy="500" r="420"/>

  <!-- Cristal superior -->
  <polygon points="500,180 560,300 500,420 440,300"/>
  <line x1="500" y1="180" x2="520" y2="300"/>
  <line x1="520" y1="300" x2="500" y2="420"/>

  <!-- Cristal superior derecho -->
  <polygon points="690,330 820,360 740,480 610,450"/>
  <line x1="690" y1="330" x2="740" y2="480"/>

  <!-- Cristal inferior derecho -->
  <polygon points="620,610 760,700 650,820 510,730"/>
  <line x1="620" y1="610" x2="650" y2="820"/>

  <!-- Cristal inferior izquierdo -->
  <polygon points="380,610 490,730 350,820 240,700"/>
  <line x1="380" y1="610" x2="350" y2="820"/>

  <!-- Cristal superior izquierdo -->
  <polygon points="310,330 390,450 260,480 180,360"/>
  <line x1="310" y1="330" x2="260" y2="480"/>

</svg>