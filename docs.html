<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuales y Documentación | Amatista Efectos</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Docs Specific CSS -->
    <style>
        /* CSS específico para la página de documentación orientada a lectura/impresión */
        :root {
            --docs-bg: #f8f9fa;
            --docs-text: #212529;
            --docs-heading: #121416;
            --docs-border: #dee2e6;
            --docs-accent: #6f42c1;
            /* Púrpura más oscuro y legible sobre blanco */
        }

        body.docs-page {
            background-color: var(--docs-bg);
            color: var(--docs-text);
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
        }

        /* Overrides to prevent styles.css dark theme from hiding text */
        .docs-page p, .docs-page ul, .docs-page ol, .docs-page li {
            color: var(--docs-text) !important;
        }
        
        .docs-page strong, .docs-page b {
            color: var(--docs-heading) !important;
        }
        
        .docs-page .muted {
            color: #6c757d !important;
        }

        .docs-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            min-height: 100vh;
        }

        .docs-header {
            text-align: center;
            padding-bottom: 2rem;
            margin-bottom: 3rem;
            border-bottom: 2px solid var(--docs-border);
        }

        .docs-header h1 {
            color: var(--docs-heading);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .docs-header p {
            color: #6c757d;
            font-size: 1.1rem;
        }

        .docs-nav {
            background: #f1f3f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 3rem;
        }

        .docs-nav h3 {
            margin-top: 0;
            color: var(--docs-heading);
            margin-bottom: 15px;
        }

        .docs-nav ul {
            list-style: none;
            padding-left: 0;
            column-count: 2;
            column-gap: 20px;
        }

        .docs-nav li {
            margin-bottom: 8px;
        }

        .docs-nav a {
            color: var(--docs-accent);
            text-decoration: none;
            font-weight: 600;
        }

        .docs-nav a:hover {
            text-decoration: underline;
        }

        .docs-section {
            margin-bottom: 4rem;
        }

        .docs-section h2 {
            color: var(--docs-heading);
            font-size: 1.8rem;
            border-bottom: 1px solid var(--docs-border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .docs-section h3 {
            color: var(--docs-heading);
            font-size: 1.4rem;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .plugin-manual {
            background: #fff;
            border: 1px solid var(--docs-border);
            border-left: 4px solid var(--docs-accent);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .parameter-list {
            list-style: none;
            padding-left: 0;
        }

        .parameter-list li {
            margin-bottom: 10px;
            display: flex;
        }

        .parameter-list strong {
            min-width: 120px;
            color: var(--docs-heading);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--docs-accent);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Utilidad para evitar cortes feos al imprimir */
        .page-break {
            page-break-before: always;
        }

        /* Optimizaciones para impresión */
        @media print {
            body.docs-page {
                background: white;
            }

            .docs-container {
                box-shadow: none;
                margin: 0;
                padding: 0;
                max-width: 100%;
            }

            .docs-nav,
            .back-link {
                display: none;
                /* No imprimir la navegación ni el botón de volver */
            }

            .docs-section {
                margin-bottom: 2rem;
            }

            a[href^="http"]:after {
                content: " (" attr(href) ")";
                font-size: 90%;
            }

            h2,
            h3 {
                page-break-after: avoid;
            }

            p,
            ul,
            .plugin-manual {
                page-break-inside: avoid;
            }
        }
    </style>
</head>

<body class="docs-page">

    <div class="docs-container">
        <!-- Top bar con Back y Lang Switcher -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <a href="index.html" class="back-link" style="margin-bottom:0;" data-i18n="back">← Volver a la Web Principal</a>
            <div class="lang-switch docs-nav-btn" style="background: #f1f3f5; padding: 5px 15px; border-radius: 20px; border: 1px solid var(--docs-border);">
                <button class="lang-btn active" data-lang="es" style="font-family: 'Outfit', sans-serif; background:none; border:none; cursor:pointer; font-weight:600; color:var(--docs-heading); font-size:14px;">ES</button>
                <span class="lang-sep" style="color:#ccc; margin:0 5px;">|</span>
                <button class="lang-btn" data-lang="en" style="font-family: 'Outfit', sans-serif; background:none; border:none; cursor:pointer; font-weight:400; color:#888; font-size:14px;">EN</button>
            </div>
        </div>

        <header class="docs-header">
            <h1 data-i18n="headerTitle">Amatista Efectos</h1>
            <p data-i18n="headerDesc">Manuales de Usuario y Documentación Técnica</p>
        </header>

        <!-- Índice -->
        <nav class="docs-nav">
            <h3 data-i18n="indexTitle">Índice</h3>
            <ul>
                <li><a href="#bienvenida" data-i18n="idx1">1. Bienvenida</a></li>
                <li><a href="#pacto-creativo" data-i18n="idx2">2. Nuestro Pacto Creativo</a></li>
                <li><a href="#instalacion" data-i18n="idx3">3. Guía de Instalación</a></li>
                <li><a href="#manuales" data-i18n="idx4">4. Manuales de Plugins</a></li>
            </ul>
        </nav>

        <!-- Secciones Dinámicas -->
        <section id="bienvenida" class="docs-section"></section>
        
        <section id="pacto-creativo" class="docs-section"></section>
        
        <div class="page-break"></div>
        
        <section id="instalacion" class="docs-section"></section>
        
        <div class="page-break"></div>
        
        <section id="manuales" class="docs-section"></section>

    </div>

    <!-- Script de traducciones de la documentación -->
    <script src="docs.js"></script>
</body>

</html>
