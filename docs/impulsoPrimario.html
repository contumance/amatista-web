<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AMATISTA · Impulso Primario · Practical Manual</title>

<style>
:root{
  --bg:#0b0d10;
  --ink:#e9edf2;
  --muted: rgba(233,237,242,.70);
  --line: rgba(233,237,242,.10);
  --accent:#b79cff;
  --accent2:#7cf1c6;
  --shadow: 0 12px 36px rgba(0,0,0,.50);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 20% 10%, rgba(183,156,255,.12), transparent 60%),
    radial-gradient(900px 600px at 80% 20%, rgba(124,241,198,.06), transparent 60%),
    radial-gradient(900px 700px at 50% 120%, rgba(255,255,255,.06), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  line-height:1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.wrap{max-width:980px;margin:56px auto;padding:0 20px 64px;}

.top{
  display:flex; justify-content:space-between; align-items:flex-end;
  gap:16px; margin-bottom:18px;
}
.brand .name{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:14px;}
.brand .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}

    /* Brand */
    .brand-logo{
      width: 96px;
      height: 96px;
      object-fit: contain;
      opacity: 0.96;
      filter: drop-shadow(0 20px 32px rgba(0,0,0,0.60));
      margin-bottom: 4px;
    }

    .brand-title{
      margin: 14px 0 6px;
      font-size: 34px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 650;
    }
    .brand-subtitle{
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.68);
    }

.meta{
  text-align:right; font-size:12px; color:var(--muted);
  letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
}
@media(max-width:900px){ .meta{display:none;} }

.langbar{
  display:flex; justify-content:flex-end; gap:10px; align-items:center;
  margin: 8px 0 18px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .10em;
  text-transform: uppercase;
  user-select:none;
}
.langbtn{
  appearance:none;
  border:1px solid var(--line);
  background: rgba(0,0,0,.22);
  color: rgba(233,237,242,.86);
  border-radius: 12px;
  padding: 8px 10px;
  font: inherit;
  cursor: pointer;
}
.langbtn[aria-pressed="true"]{
  border-color: rgba(183,156,255,.35);
  background: rgba(183,156,255,.10);
  color: rgba(233,237,242,.92);
}

.card{
  position:relative;
  background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card::before{
  content:""; position:absolute; inset:-2px;
  background:
    radial-gradient(1200px 500px at 10% 0%, rgba(183,156,255,.10), transparent 55%),
    radial-gradient(900px 500px at 90% 0%, rgba(124,241,198,.05), transparent 55%),
    linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
  pointer-events:none; opacity:.9;
}

.hero{
  position:relative;
  padding:28px 28px 18px;
  border-bottom:1px solid var(--line);
}
.kicker{
  display:inline-flex; align-items:center; gap:10px;
  font-size:12px; color:var(--muted);
  letter-spacing:.14em; text-transform:uppercase;
}
.dot{
  width:8px; height:8px; border-radius:99px; background:var(--accent);
  box-shadow:0 0 0 6px rgba(183,156,255,.10);
  flex:0 0 auto;
}
h1{ margin:12px 0 8px; font-size:28px; line-height:1.15; letter-spacing:.02em; }
.subtitle{ margin:0; color:var(--muted); font-size:14px; max-width:75ch; }

.content{
  position:relative;
  padding:26px 28px 30px;
  display:grid;
  grid-template-columns: 1.35fr .65fr;
  gap:24px;
}
@media(max-width:900px){
  .content{ grid-template-columns:1fr; }
}

h2{
  margin:0 0 10px;
  font-size:14px; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(233,237,242,.92);
}
h3{
  margin:14px 0 8px;
  font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(233,237,242,.82);
}
p{ margin:10px 0; font-size:14px; color:rgba(233,237,242,.88); }
ul{ padding-left:18px; margin:8px 0; }
li{ margin:6px 0; color:rgba(233,237,242,.86); }
.muted{ color: var(--muted); }

.rule{ height:1px; background:var(--line); margin:16px 0; }

.side{
  border-left:1px solid var(--line);
  padding-left:22px;
}
@media(max-width:900px){
  .side{ border-left:none; padding-left:0; border-top:1px solid var(--line); padding-top:18px; }
}

.panel{
  border:1px solid var(--line);
  border-radius:14px;
  background: rgba(0,0,0,.18);
  padding:14px;
}

.badge{
  display:inline-flex; align-items:center; gap:10px;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background: rgba(0,0,0,.22);
  width:100%;
  margin-bottom:10px;
}
.badge strong{
  font-size:12px; letter-spacing:.12em; text-transform:uppercase;
}
.badge span{
  font-size:12px; color:var(--muted); margin-left:auto;
  letter-spacing:.06em; text-transform:uppercase;
}

.callout{
  border:1px solid rgba(183,156,255,.22);
  background: rgba(183,156,255,.06);
  border-radius:14px;
  padding:14px 14px 12px;
  margin-top:12px;
}
.callout .t{
  font-weight:800;
  letter-spacing:.10em; text-transform:uppercase;
  font-size:12px; color:rgba(233,237,242,.92);
  margin-bottom:6px;
}
.callout p{ margin:0; font-size:13px; color:rgba(233,237,242,.84); }

.callout.alt{
  border-color: rgba(124,241,198,.22);
  background: rgba(124,241,198,.06);
}

/* Section blocks: make each part feel “carded” */
.sec{
  border:1px solid var(--line);
  border-radius:16px;
  background: rgba(0,0,0,.14);
  padding:16px 16px 14px;
  margin: 0 0 14px;
  position:relative;
}
.sec::before{
  content:"";
  position:absolute;
  left:0; top:12px; bottom:12px;
  width:3px;
  border-radius:99px;
  background: linear-gradient(180deg, rgba(183,156,255,.70), rgba(124,241,198,.25));
  opacity:.85;
}
.sec > *{ margin-left: 10px; }
.sec h2{ margin-top:2px; }

/* Small chips row (optional visual separation) */
.chips{ display:flex; flex-wrap:wrap; gap:10px; margin: 0 0 16px; }
.chip{
  border:1px solid var(--line);
  background: rgba(0,0,0,.22);
  border-radius:999px;
  padding:8px 10px;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:rgba(233,237,242,.86);
}

/* Footer */
footer{
  padding:16px 28px;
  border-top:1px solid var(--line);
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
a{
  color: rgba(233,237,242,.92);
  text-decoration:none;
  border-bottom:1px solid rgba(233,237,242,.22);
  padding-bottom:1px;
}
a:hover{ border-bottom-color: rgba(183,156,255,.55); }

@media print{
  /* Estética clara y legible en PDF (texto oscuro + fondos claros) */
  :root{
    --bg:#ffffff;
    --ink:#0b0d10;
    --muted: rgba(11,13,16,.72);
    --line: rgba(11,13,16,.16);
    --accent:#0b0d10;
    --accent2:#0b0d10;
    --shadow:none;
  }

  /* Evita “sorpresas” del navegador al imprimir */
  *{
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body{
    background:#ffffff !important;
    color:var(--ink) !important;
  }

  /* Layout a página */
  .wrap{
    margin:0 !important;
    padding:0 !important;
    max-width:none !important;
  }

  /* Apaga decoraciones de pantalla */
  .langbar{ display:none !important; }
  .card::before{ display:none !important; }

  .card{
    border-radius:0 !important;
    box-shadow:none !important;
    background:#ffffff !important;
    border:1px solid var(--line) !important;
  }

  .hero{
    background:#ffffff !important;
    border-bottom:1px solid var(--line) !important;
  }

  /* Texto */
  h1, h2, h3{ color:#000 !important; }
  p, li{ color:#111 !important; }
  .muted, .meta, .brand .tag, .kicker{ color:rgba(0,0,0,.70) !important; }

  /* Secciones (las “sec” del manual) */
  .sec{
    background:#ffffff !important;
    border:1px solid var(--line) !important;
  }
  .sec::before{
    background:#000 !important;
    opacity:.18 !important;
  }

  /* Panels/Aside */
  .panel{
    background:#ffffff !important;
    border:1px solid var(--line) !important;
  }
  .side{
    border-left:1px solid var(--line) !important;
  }

  /* Callouts */
  .callout{
    background:#ffffff !important;
    border:1px solid rgba(0,0,0,.22) !important;
  }
  .warnDot{
    background:#000 !important;
    box-shadow:none !important;
  }

  /* Chips/Badges */
  .chip, .badge{
    background:#ffffff !important;
    border:1px solid var(--line) !important;
    color:#111 !important;
  }
  .badge span{ color:rgba(0,0,0,.70) !important; }

  /* Links */
  a{
    color:#000 !important;
    text-decoration:none !important;
    border:none !important;
  }

  /* Evitar cortes feos */
  h1,h2,h3{ break-after: avoid-page; }
  .sec, .panel, p, li{ break-inside: avoid; }

  @page{
    size:A4;
    margin:18mm;
  }
}

</style>
</head>

</main>

<script>
  const i18n = JSON.parse(document.getElementById("i18n").textContent);

  const btnEN = document.getElementById("btnEN");
  const btnES = document.getElementById("btnES");

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function renderBadges(badges){
    const host = document.getElementById("badges");
    host.innerHTML = "";
    (badges || []).forEach(b => {
      const el = document.createElement("div");
      el.className = "badge";
      el.innerHTML = `<strong>${escapeHtml(b.label)}</strong><span>${escapeHtml(b.value)}</span>`;
      host.appendChild(el);
    });
  }

  function setLang(lang){
    const t = i18n[lang] || i18n.en;
    document.documentElement.lang = lang;

    document.getElementById("langLabel").textContent = t.langLabel;
    document.getElementById("metaTitle").textContent = t.meta;

    document.getElementById("kicker").textContent = t.kicker;
    document.getElementById("title").textContent = t.title;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.title = `AMATISTA · ${t.title}`;

    // chips
    const chips = document.getElementById("chips");
    chips.innerHTML = (t.chips || []).map(c => `<span class="chip">${escapeHtml(c)}</span>`).join("");

    // main sections with nicer separation
    const main = document.getElementById("mainContent");
    main.innerHTML = (t.sections || []).map(s => `<section class="sec">${s}</section>`).join("");

    // aside
    renderBadges(t.asideBadges);
    document.getElementById("asideTitle").textContent = t.asideTitle;
    document.getElementById("asideBody").innerHTML = (t.asideBody || []).join("");
    document.getElementById("asideNoteTitle").textContent = t.asideNoteTitle;
    document.getElementById("asideNoteBody").textContent = t.asideNoteBody;
    document.getElementById("asideRecipesTitle").textContent = t.asideRecipesTitle;
    document.getElementById("asideRecipesBody").textContent = t.asideRecipesBody;

    // footer
    document.getElementById("footerLeft").textContent = t.footerLeft;

    btnEN.setAttribute("aria-pressed", lang === "en" ? "true" : "false");
    btnES.setAttribute("aria-pressed", lang === "es" ? "true" : "false");
  }

  btnEN.addEventListener("click", () => setLang("en"));
  btnES.addEventListener("click", () => setLang("es"));

  setLang("es");
</script>
</body>
</html>
